name: Web-Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # nur für den Bilder-Branch ci-bilder/* (Probe-Screenshots)
    steps:
      - uses: actions/checkout@v4

      - name: Godot und Web-Vorlagen installieren
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir"
          unzip -q -j templates.tpz 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' 'templates/version.txt' -d "$dir"
          rm godot.zip templates.tpz

      - name: Projekt importieren und Skripte prüfen
        run: |
          godot --headless --import
          godot --headless --quit-after 60 2>&1 | tee run.log
          ! grep -E "SCRIPT ERROR|Parse Error" run.log

      - name: Item-Logiktest (Sockel, Sets, Mods)
        run: |
          godot --headless -s res://tools/items/test_extras.gd 2>&1 | tee items.log | grep -E "ITEM|Gear-Wert|ERROR" || true
          grep -q "ITEM-TEST OK" items.log
          ! grep -E "SCRIPT ERROR|Parse Error|ITEM-TEST FEHLER" items.log

      - name: Raid-Logiktest (Essenwächter)
        run: |
          timeout 300 godot --headless --fixed-fps 60 -s res://tools/raid/probe.gd 2>&1 | tee raid.log | grep -E "RAID|SCRIPT ERROR" || true
          grep -q "RAID-TEST OK" raid.log
          ! grep -E "SCRIPT ERROR|Parse Error" raid.log

      - name: Raid-Beute-Test (Tageschance, Marken)
        run: |
          godot --headless -s res://tools/raid/test_loot.gd 2>&1 | tee loot.log | grep -E "LOOT|SCRIPT ERROR" || true
          grep -q "LOOT-TEST OK" loot.log
          ! grep -E "SCRIPT ERROR|Parse Error" loot.log

      - name: Turm-Logiktest (Endloser Turm)
        run: |
          timeout 300 godot --headless --fixed-fps 60 -s res://tools/tower/probe.gd 2>&1 | tee turm.log | grep -E "TURM|SCRIPT ERROR" || true
          grep -q "TURM-TEST OK" turm.log
          ! grep -E "SCRIPT ERROR|Parse Error" turm.log

      - name: Raid-Rüstung-Logiktest (Essenwacht, 6 Seltenheiten)
        run: |
          godot --headless -s res://tools/raid_armor/test_armor.gd 2>&1 | tee ruestung.log | grep -E "RUESTUNG|SCRIPT ERROR" || true
          grep -q "RUESTUNG-TEST OK" ruestung.log
          ! grep -E "SCRIPT ERROR|Parse Error" ruestung.log

      - name: Raid-Rüstung-Probe (Bilder auf ci-bilder/ruestung)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          mkdir -p ruestung-probe
          timeout 120 xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 60 -s res://tools/raid_armor/probe.gd -- "$PWD/ruestung-probe" > ruestung-probe.log 2>&1 || true
          grep -A3 -E "RUESTUNG|SCRIPT ERROR" ruestung-probe.log | head -30 || true
          cd ruestung-probe
          ls *.png > /dev/null 2>&1 || exit 0
          git init -q . && git checkout -q -b bilder
          git add *.png
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Rüstungs-Probe ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bilder:refs/heads/ci-bilder/ruestung
          rm -rf .git

      - name: PostFx-Probe (Vorher/Nachher-Bilder auf ci-bilder/postfx)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          mkdir -p postfx-probe
          for tag in vorher nachher; do
            timeout 180 xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 60 -s res://tools/postfx/probe.gd -- "$PWD/postfx-probe" $tag > postfx-$tag.log 2>&1 || true
            grep -A3 -E "POSTFX|SCRIPT ERROR|SHADER ERROR" postfx-$tag.log | head -40 || true
          done
          cd postfx-probe
          ls *.png > /dev/null 2>&1 || exit 0
          git init -q . && git checkout -q -b bilder
          git add *.png
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "PostFx-Probe ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bilder:refs/heads/ci-bilder/postfx
          rm -rf .git

      - name: Raid-Probe (Bilder)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p raid-probe
          timeout 300 xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 60 -s res://tools/raid/probe.gd -- "$PWD/raid-probe" > raid-probe.log 2>&1 || true
          timeout 300 xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 60 -s res://tools/tower/probe.gd -- "$PWD/raid-probe" > turm-probe.log 2>&1 || true
          ls -la raid-probe

      - name: Raid-Bilder auf den Branch ci-bilder/raid legen
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          cd raid-probe
          ls *.png > /dev/null 2>&1 || exit 0
          git init -q . && git checkout -q -b bilder
          git add *.png
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Raid-Probe ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bilder:refs/heads/ci-bilder/raid
          rm -rf .git

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: raid-probe
          path: raid-probe
          if-no-files-found: ignore

      - name: Item-Probe (Bilder vom Menü)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p item-probe
          timeout 120 xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 60 -s res://tools/items/probe.gd -- "$PWD/item-probe" > probe.log 2>&1 || true
          ls -la item-probe

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: item-probe
          path: item-probe
          if-no-files-found: ignore

      - name: Web-Export
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: chibi-legends-web
          path: build/web

      - name: Item-Bericht (Logiktest und Probe)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo "--- Logiktest:"; grep -E "ITEM|Gear-Wert|ERROR" items.log || true
          echo "--- Fehler in der Probe:"; grep -A3 -E "SCRIPT ERROR|ERROR:" probe.log | head -60 || true
          echo "--- Ende der Probe:"; tail -8 probe.log || true
          echo "--- Raid-Probe Fehler:"; grep -A3 -E "SCRIPT ERROR|ERROR:" raid-probe.log | head -40 || true
          echo "--- Raid-Probe Regeln:"; grep -E "^RAID" raid-probe.log || true
          echo "--- Turm-Probe Fehler:"; grep -A3 -E "SCRIPT ERROR|ERROR:" turm-probe.log | head -40 || true
          echo "--- Turm-Probe Regeln:"; grep -E "^TURM" turm-probe.log || true

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    # Lädt jeden Stand von main auf GitHub Pages hoch.
    # Einmalig nötig: Settings > Pages > Source: "GitHub Actions".
    # Solange Pages nicht aktiv ist, schlägt nur dieser Schritt fehl, der Build bleibt grün.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
